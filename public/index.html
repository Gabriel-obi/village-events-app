<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agulu Village</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">

    <!-- AUTH SECTION -->
    <section id="auth-section">
      <h2 id="auth-title">Login</h2>

      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />

      <button id="auth-btn">Login</button>

      <p class="toggle">
        No account?
        <span id="toggle-auth">Sign up</span>
      </p>
    </section>

    <!-- EVENTS SECTION -->
    <section id="events-section" class="hidden">

      <header>
        <h2 id="village-name">Agulu Village</h2>
        <button id="logout-btn">Logout</button>
      </header>

      <div class="card">
        <input id="event-date" type="date" />
        <textarea id="event-desc" placeholder="Event description"></textarea>
        <button id="post-event">Post Event</button>
      </div>

      <h3>Upcoming Events</h3>
      <ul id="events-list"></ul>

    </section>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
